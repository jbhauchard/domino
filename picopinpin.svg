<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Pinpin, man-sized scarlet macaw mascot, juggling gin bottles at the #GCU bar</title>
  <desc id="dsc">Animated velvet-textured scarlet macaw, 1.75 m tall, juggling three gin bottles in a cascade in front of a bar counter with a pink neon #GCU sign, shelves of bottles and brass pendant lamps.</desc>

  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1b16"/>
      <stop offset="0.65" stop-color="#1d1210"/>
      <stop offset="1" stop-color="#150d0b"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2418"/>
      <stop offset="1" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2d1c"/>
      <stop offset="0.5" stop-color="#5d3a24"/>
      <stop offset="1" stop-color="#3a2215"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0.2" y1="0.1" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e8323f"/>
      <stop offset="0.45" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#8c0b21"/>
    </linearGradient>
    <linearGradient id="gWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d81f38"/>
      <stop offset="1" stop-color="#9c0d24"/>
    </linearGradient>
    <linearGradient id="gTail" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#d81f38"/>
      <stop offset="0.55" stop-color="#c01028"/>
      <stop offset="0.78" stop-color="#f0b429"/>
      <stop offset="0.9" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a3e7a"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6d8"/>
      <stop offset="0.35" stop-color="#eff7f1"/>
      <stop offset="0.75" stop-color="#b9d4c6"/>
      <stop offset="1" stop-color="#8fb3a3"/>
    </linearGradient>
    <radialGradient id="gLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffb95e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb95e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSpot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6c2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffe6c2" stop-opacity="0"/>
    </radialGradient>

    <!-- velvet nap: soft fuzzy edges, matte (no specular) -->
    <filter id="velvet" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="7" result="nap"/>
      <feDisplacementMap in="SourceGraphic" in2="nap" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="neon" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- juggling cascade: left wing tip to right wing tip over the head -->
    <path id="arc" d="M 350 312 Q 450 -90 550 312" fill="none"/>

    <!-- one gin bottle, drawn centred on its own origin so it can spin -->
    <g id="bottle">
      <rect x="-9" y="-36" width="18" height="16" fill="url(#gGlass)"/>
      <path d="M -8,-22 C -8,-14 -16,-14 -16,-2 L -16,30 Q -16,40 -6,40 L 6,40 Q 16,40 16,30 L 16,-2 C 16,-14 8,-14 8,-22 Z" fill="url(#gGlass)"/>
      <path d="M -8,-22 C -8,-14 -16,-14 -16,-2 L -16,30 Q -16,40 -6,40 L 6,40 Q 16,40 16,30 L 16,-2 C 16,-14 8,-14 8,-22 Z" fill="none" stroke="#6f8f80" stroke-width="1.2" opacity="0.7"/>
      <rect x="-13" y="2" width="26" height="24" rx="3" fill="#f6f1e5" stroke="#cfc4ad" stroke-width="1"/>
      <text x="0" y="16" font-family="Verdana, DejaVu Sans, sans-serif" font-size="10" letter-spacing="1" text-anchor="middle" fill="#1f3b2d">GIN</text>
      <circle cx="-6" cy="22" r="1.7" fill="#2e6b3f"/>
      <circle cx="0" cy="24" r="1.7" fill="#2e6b3f"/>
      <circle cx="6" cy="22" r="1.7" fill="#2e6b3f"/>
      <rect x="-11" y="-4" width="4" height="34" rx="2" fill="#ffffff" opacity="0.38"/>
      <rect x="-9" y="-40" width="18" height="6" rx="2" fill="#c9a227"/>
      <rect x="-9" y="-46" width="18" height="8" rx="3" fill="#8d6a3f"/>
    </g>
  </defs>

  <!-- ================= ROOM ================= -->
  <rect width="900" height="700" fill="url(#gWall)"/>
  <rect y="645" width="900" height="55" fill="url(#gFloor)"/>
  <path d="M0,645 H900" stroke="#0c0705" stroke-width="3"/>
  <g stroke="#0f0907" stroke-width="1.5" opacity="0.5">
    <path d="M120,645 V700"/><path d="M280,645 V700"/><path d="M440,645 V700"/><path d="M600,645 V700"/><path d="M760,645 V700"/>
  </g>
  <g fill="url(#gSpot)">
    <circle cx="180" cy="230" r="120"/><circle cx="640" cy="330" r="140"/><circle cx="420" cy="520" r="150"/>
  </g>
  <!-- bokeh -->
  <g fill="#ffcf8f" opacity="0.07">
    <circle cx="90" cy="140" r="26"/><circle cx="150" cy="330" r="16"/><circle cx="820" cy="120" r="22"/><circle cx="560" cy="150" r="13"/>
  </g>

  <!-- ================= BACK BAR (right) ================= -->
  <g>
    <rect x="520" y="200" width="360" height="445" fill="#241512" stroke="#120a08" stroke-width="3"/>
    <rect x="534" y="214" width="332" height="150" fill="#1b100e"/>
    <rect x="520" y="364" width="360" height="12" fill="url(#gWood)"/>
    <rect x="520" y="452" width="360" height="12" fill="url(#gWood)"/>
    <!-- bottles on the upper shelf -->
    <g>
      <rect x="548" y="312" width="22" height="52" rx="4" fill="#2e7d32"/>
      <rect x="556" y="300" width="6" height="14" fill="#2e7d32"/>
      <rect x="586" y="304" width="20" height="60" rx="4" fill="#6d4c41"/>
      <rect x="593" y="292" width="6" height="14" fill="#6d4c41"/>
      <rect x="622" y="318" width="24" height="46" rx="4" fill="#00838f"/>
      <rect x="631" y="306" width="6" height="14" fill="#00838f"/>
      <rect x="664" y="308" width="20" height="56" rx="4" fill="#c62828"/>
      <rect x="671" y="296" width="6" height="14" fill="#c62828"/>
      <rect x="700" y="316" width="22" height="48" rx="4" fill="#b08d57"/>
      <rect x="708" y="304" width="6" height="14" fill="#b08d57"/>
      <rect x="742" y="306" width="18" height="58" rx="4" fill="#37474f"/>
      <rect x="748" y="294" width="6" height="14" fill="#37474f"/>
      <rect x="778" y="320" width="24" height="44" rx="4" fill="#7b1fa2"/>
      <rect x="787" y="308" width="6" height="14" fill="#7b1fa2"/>
      <rect x="820" y="310" width="20" height="54" rx="4" fill="#00695c"/>
      <rect x="827" y="298" width="6" height="14" fill="#00695c"/>
    </g>
    <!-- glasses on the lower shelf -->
    <g fill="#dfeae6" opacity="0.62">
      <path d="M556,452 v-30 h20 v30 z M552,452 h28 v5 h-28 z"/>
      <path d="M596,452 v-30 h20 v30 z M592,452 h28 v5 h-28 z"/>
      <path d="M640,452 l10,-30 10,30 z M636,452 h28 v5 h-28 z"/>
      <path d="M700,452 v-26 q10,-8 20,0 v26 z"/>
      <path d="M742,452 v-26 q10,-8 20,0 v26 z"/>
    </g>
    <!-- bartender behind the counter: same 1.75 m, legs hidden by the bar -->
    <g opacity="0.5" fill="#0d0806">
      <circle cx="700" cy="272" r="27"/>
      <path d="M700,301 q-48,6 -52,64 l0,280 h104 l0,-280 q-4,-58 -52,-64 z"/>
    </g>
    <!-- counter top, taps, foot rail -->
    <rect x="512" y="464" width="376" height="16" rx="4" fill="#6b4429"/>
    <rect x="512" y="478" width="376" height="167" fill="#2b1a13"/>
    <g>
      <rect x="616" y="500" width="9" height="34" rx="3" fill="#c9a227"/>
      <circle cx="620" cy="496" r="9" fill="#8d6a3f"/>
      <rect x="656" y="500" width="9" height="34" rx="3" fill="#c9a227"/>
      <circle cx="660" cy="496" r="9" fill="#a3341f"/>
    </g>
    <rect x="520" y="612" width="360" height="7" rx="3" fill="#c9a227" opacity="0.75"/>
    <!-- chalk menu -->
    <rect x="700" y="512" width="150" height="78" rx="6" fill="#141a17" stroke="#5d3a24" stroke-width="4"/>
    <text x="775" y="542" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#e8dcc0">GIN TONIC</text>
    <text x="775" y="570" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#cbb894">4 EUR  -  2 FOR 7</text>
  </g>

  <!-- ================= NEON #GCU ================= -->
  <g filter="url(#neon)">
    <text x="160" y="132" font-family="Trebuchet MS, Verdana, sans-serif" font-size="76" font-weight="bold" text-anchor="middle" fill="#ff2d75" stroke="#ffb3cd" stroke-width="1.5">#GCU</text>
    <animate attributeName="opacity" values="1;1;0.62;1;0.9;1;1;0.55;1;1" keyTimes="0;0.28;0.31;0.34;0.42;0.46;0.78;0.81;0.85;1" dur="5.5s" repeatCount="indefinite"/>
  </g>
  <rect x="50" y="66" width="220" height="82" rx="14" fill="none" stroke="#ff2d75" stroke-width="3" opacity="0.35" filter="url(#neon)"/>

  <!-- ================= PENDANT LAMPS ================= -->
  <g>
    <path d="M300,0 V118" stroke="#7a5a3a" stroke-width="3"/>
    <path d="M266,166 q34,-56 68,0 z" fill="#8d6a3f"/>
    <ellipse cx="300" cy="166" rx="34" ry="8" fill="#ffd9a0" opacity="0.85"/>
    <circle cx="300" cy="196" r="86" fill="url(#gLamp)">
      <animate attributeName="opacity" values="0.9;1;0.86;1;0.9" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M600,0 V86" stroke="#7a5a3a" stroke-width="3"/>
    <path d="M566,134 q34,-56 68,0 z" fill="#8d6a3f"/>
    <ellipse cx="600" cy="134" rx="34" ry="8" fill="#ffd9a0" opacity="0.85"/>
    <circle cx="600" cy="164" r="86" fill="url(#gLamp)">
      <animate attributeName="opacity" values="1;0.88;1;0.94;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= FLOOR SHADOW ================= -->
  <ellipse cx="450" cy="650" rx="112" ry="17" fill="#000000" opacity="0.4">
    <animate attributeName="rx" values="112;104;112" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>

  <!-- ================= PINPIN THE MACAW (1.75 m) ================= -->
  <g filter="url(#velvet)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 448 516;3 448 516;-3 448 516" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M448,508 C432,566 396,616 336,656 L318,634 C376,594 408,552 420,502 Z" fill="url(#gTail)"/>
      <path d="M440,512 C426,566 396,610 344,646" fill="none" stroke="#7c0a1c" stroke-width="2" opacity="0.45"/>
    </g>

    <!-- legs + feet -->
    <g>
      <rect x="418" y="548" width="20" height="66" rx="9" fill="#8a8f96"/>
      <rect x="462" y="548" width="20" height="66" rx="9" fill="#767b82"/>
      <g fill="#6d7278">
        <path d="M400,634 q38,-16 60,0 q-6,12 -30,12 q-24,0 -30,-12 z"/>
        <path d="M444,634 q38,-16 60,0 q-6,12 -30,12 q-24,0 -30,-12 z"/>
      </g>
      <g stroke="#4d5157" stroke-width="2" opacity="0.7">
        <path d="M414,632 v12"/><path d="M430,630 v14"/><path d="M458,632 v12"/><path d="M474,630 v14"/>
      </g>
    </g>

    <!-- body -->
    <path d="M450,344 C512,344 542,398 542,456 C542,528 506,566 450,566 C394,566 358,528 358,456 C358,398 388,344 450,344 Z" fill="url(#gBody)"/>
    <!-- velvet nap lines on the chest -->
    <g fill="none" stroke="#8c0b21" stroke-width="2" opacity="0.22">
      <path d="M398,404 q52,26 104,0"/>
      <path d="M390,436 q60,28 120,0"/>
      <path d="M392,468 q58,26 116,0"/>
      <path d="M402,500 q48,22 96,0"/>
    </g>
    <path d="M450,344 C512,344 542,398 542,456 C542,528 506,566 450,566" fill="none" stroke="#6f0717" stroke-width="3" opacity="0.25"/>

    <!-- raised wings = juggling arms -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 405 380;-5 405 380;0 405 380" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M405,380 C372,362 358,338 350,314" fill="none" stroke="url(#gWing)" stroke-width="30" stroke-linecap="round"/>
      <g>
        <path d="M350,314 q-30,-6 -38,-26 q26,-4 40,10 z" fill="#f2ece6"/>
        <path d="M350,314 q-24,-16 -24,-40 q22,8 30,30 z" fill="#2b6cb0"/>
        <path d="M352,312 q-10,-26 2,-46 q14,16 10,42 z" fill="#1a3e7a"/>
      </g>
      <path d="M405,380 C372,362 358,338 350,314" fill="none" stroke="#7c0a1c" stroke-width="2" opacity="0.3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 495 380;5 495 380;0 495 380" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M495,380 C528,362 542,338 550,314" fill="none" stroke="url(#gWing)" stroke-width="30" stroke-linecap="round"/>
      <g>
        <path d="M550,314 q30,-6 38,-26 q-26,-4 -40,10 z" fill="#f2ece6"/>
        <path d="M550,314 q24,-16 24,-40 q-22,8 -30,30 z" fill="#2b6cb0"/>
        <path d="M548,312 q10,-26 -2,-46 q-14,16 -10,42 z" fill="#1a3e7a"/>
      </g>
      <path d="M495,380 C528,362 542,338 550,314" fill="none" stroke="#7c0a1c" stroke-width="2" opacity="0.3"/>
    </g>

    <!-- velvet bow tie -->
    <g>
      <path d="M450,368 l-26,-13 v26 z" fill="#7b1e2b"/>
      <path d="M450,368 l26,-13 v26 z" fill="#8e2434"/>
      <rect x="443" y="360" width="14" height="16" rx="4" fill="#5f1620"/>
    </g>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 450 344;2 450 344;-2 450 344" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <circle cx="450" cy="302" r="57" fill="url(#gBody)"/>
      <path d="M424,250 q10,-14 22,-6 M446,246 q8,-13 20,-4" fill="none" stroke="#8c0b21" stroke-width="2.5" opacity="0.5"/>
      <!-- bare face patch -->
      <ellipse cx="474" cy="304" rx="28" ry="25" fill="#f7efe9"/>
      <g stroke="#d98f9c" stroke-width="1.6" opacity="0.85" fill="none">
        <path d="M456,292 q16,-4 30,2"/>
        <path d="M454,304 q18,-4 34,2"/>
        <path d="M458,316 q16,-2 28,4"/>
      </g>
      <!-- eye -->
      <circle cx="478" cy="288" r="9" fill="#f6d365"/>
      <circle cx="479" cy="288" r="4.6" fill="#1a1a1a"/>
      <circle cx="481" cy="286" r="1.6" fill="#ffffff"/>
      <!-- hooked beak -->
      <path d="M498,286 q34,2 34,26 q0,26 -22,32 q10,-16 2,-28 q-8,-12 -18,-14 z" fill="#1c1c1c"/>
      <path d="M500,320 q16,4 14,18 q-8,10 -20,6 q10,-10 6,-24 z" fill="#e6dccb"/>
      <path d="M500,292 q22,4 24,20" fill="none" stroke="#4a4a4a" stroke-width="2" opacity="0.6"/>
    </g>
  </g>

  <!-- ================= JUGGLING GIN ================= -->
  <g>
    <g>
      <animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" rotate="0" calcMode="spline" keyTimes="0;1" keySplines="0.35 0.05 0.65 0.95">
        <mpath xlink:href="#arc"/>
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" begin="0s" repeatCount="indefinite"/>
        <use xlink:href="#bottle"/>
      </g>
    </g>
    <g>
      <animateMotion dur="1.6s" begin="-0.533s" repeatCount="indefinite" rotate="0" calcMode="spline" keyTimes="0;1" keySplines="0.35 0.05 0.65 0.95">
        <mpath xlink:href="#arc"/>
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" begin="-0.533s" repeatCount="indefinite"/>
        <use xlink:href="#bottle"/>
      </g>
    </g>
    <g>
      <animateMotion dur="1.6s" begin="-1.066s" repeatCount="indefinite" rotate="0" calcMode="spline" keyTimes="0;1" keySplines="0.35 0.05 0.65 0.95">
        <mpath xlink:href="#arc"/>
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" begin="-1.066s" repeatCount="indefinite"/>
        <use xlink:href="#bottle"/>
      </g>
    </g>
  </g>

  <!-- ================= SCALE BRACKET ================= -->
  <g stroke="#e8dcc0" stroke-width="2" opacity="0.6" fill="none">
    <path d="M252,246 V645"/>
    <path d="M242,246 H262"/>
    <path d="M242,645 H262"/>
  </g>
  <text x="238" y="452" transform="rotate(-90 238 452)" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" fill="#e8dcc0" opacity="0.75">1.75 m</text>

  <!-- ================= BAR STOOL (left foreground) ================= -->
  <g>
    <ellipse cx="140" cy="556" rx="58" ry="16" fill="#5d3a24"/>
    <ellipse cx="140" cy="550" rx="58" ry="16" fill="#7a4f2e"/>
    <g stroke="#3a2215" stroke-width="8" stroke-linecap="round">
      <path d="M108,566 L96,645"/><path d="M172,566 L184,645"/><path d="M140,570 L140,645"/>
    </g>
    <path d="M104,606 H176" stroke="#c9a227" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- caption -->
  <text x="36" y="686" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#d9c7a7" opacity="0.7">pinpin @ #GCU bar - scarlet macaw, 1.75 m, gin cascade</text>
</svg>
